version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsebilling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsebilling
      POSTGRES_PASSWORD: pulsebilling
      POSTGRES_DB: pulsebilling_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsebilling -d pulsebilling_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pulsebilling-net

  redis:
    image: redis:7-alpine
    container_name: pulsebilling-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - pulsebilling-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  pulsebilling-net:
    driver: bridge
